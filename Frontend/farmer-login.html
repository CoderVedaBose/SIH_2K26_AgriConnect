<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Farmer Login | AgriConnect</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="auth.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet"></head>
<body class="auth-page">
<div class="auth-shell"><div class="auth-brand"><a href="index.html"><span class="leaf">🌱</span><strong>Agri</strong>Connect</a><p>Direct from farms. Fair for everyone.</p></div>
<div class="auth-card"><span class="auth-role">👨‍🌾 FARMER LOGIN</span><h1>Farmer Login</h1><p class="subtitle">Sign in to continue to your AgriConnect marketplace account.</p><form id="farmerLoginForm" class="auth-form"><div class="form-group"><label for="phone">Phone Number</label><input id="phone" name="phone" type="tel" placeholder="10-digit mobile number" required pattern="[0-9]{10}"></div>
<div class="form-group"><label for="password">Password</label><input id="password" name="password" type="password" placeholder="Your password" required></div><div id="authMessage" class="auth-message"></div><button id="submitAuthBtn" type="submit" class="btn btn-primary full-width btn-large">Login as Farmer</button></form><div class="auth-footer">New farmer? <a href="farmer-register.html">Create an account</a></div><a class="auth-back" href="index.html">← Back to marketplace</a></div></div><script src="auth.js"></script></body></html>
