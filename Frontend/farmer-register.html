<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Farmer Registration | AgriConnect</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="auth.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet"></head>
<body class="auth-page">
<div class="auth-shell"><div class="auth-brand"><a href="index.html"><span class="leaf">🌱</span><strong>Agri</strong>Connect</a><p>Direct from farms. Fair for everyone.</p></div>
<div class="auth-card"><span class="auth-role">👨‍🌾 FARMER ACCOUNT</span><h1>Farmer Registration</h1><p class="subtitle">Sign in to continue to your AgriConnect marketplace account.</p><form id="farmerRegisterForm" class="auth-form"><div class="form-group"><label for="name">Farmer / Farm Name</label><input id="name" name="name" type="text" placeholder="e.g. Green Valley Farms" required></div>
<div class="form-group"><label for="phone">Phone Number</label><input id="phone" name="phone" type="tel" placeholder="10-digit mobile number" required pattern="[0-9]{10}"></div>
<div class="form-group"><label for="location">Location</label><input id="location" name="location" type="text" placeholder="e.g. Nadia, WB" required></div>
<div class="form-group"><label for="produce">Main Produce</label><input id="produce" name="produce" type="text" placeholder="e.g. Tomatoes, Rice, Mangoes" required></div>
<div class="form-group"><label for="password">Password</label><input id="password" name="password" type="password" placeholder="Create a password" required minlength="6"></div><div id="authMessage" class="auth-message"></div><button id="submitAuthBtn" type="submit" class="btn btn-primary full-width btn-large">Create Farmer Account</button></form><div class="auth-footer">Already registered? <a href="farmer-login.html">Login as Farmer</a></div><a class="auth-back" href="index.html">← Back to marketplace</a></div></div><script src="auth.js"></script></body></html>
